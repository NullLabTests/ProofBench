name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (no network access needed at test time)
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check proofbench/ tests/
      - name: Mypy (strict)
        run: mypy proofbench/
      - name: Pytest (offline, deterministic)
        env:
          PROOFBENCH_MODEL_API_KEY: ""
          PROOFBENCH_MODEL_API_BASE: ""
          PROOFBENCH_MODEL_ID: ""
        run: pytest -q
