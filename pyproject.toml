[project]
name = "proofbench"
version = "0.1.0"
description = "Research-grade benchmarking for long-horizon AI improvement with independently verifiable evidence bundles"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ProofBench contributors" }]
dependencies = [
    "pydantic>=2.6,<3",
    "numpy>=1.26",
    # typer 0.26+ vendors click as typer._click; cli.main() resolves the
    # exception module at runtime and is tested against 0.26.x. The <0.27
    # ceiling guards against untested future API shifts — raise deliberately.
    "typer>=0.12,<0.27",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
proofbench = "proofbench.cli:main"

[project.urls]
Homepage = "https://github.com/NullLabTests/ProofBench"
Repository = "https://github.com/NullLabTests/ProofBench"
Documentation = "https://github.com/NullLabTests/ProofBench/tree/main/docs"
Issues = "https://github.com/NullLabTests/ProofBench/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["proofbench*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer's declarative Argument/Option default pattern is idiomatic.
"proofbench/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["typer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "scipy>=1.17.1",
]
